<!-- App JavaScript -->
<!-- Developer-only audio diagnostics: inert unless explicitly enabled. -->
<script>
  try {
    const setting = new URLSearchParams(window.location.search).get("audioDiag");
    if (setting === "on") localStorage.setItem("biblozooAudioDiagnostics", "1");
    else if (setting === "off") localStorage.setItem("biblozooAudioDiagnostics", "0");
    // Patch 60: optional persistent A/B switch, native iOS only.
    const coord = new URLSearchParams(window.location.search).get("audioCoord");
    if (coord === "off") localStorage.setItem("biblozooAudioCoordination", "0");
    else if (coord === "on") localStorage.setItem("biblozooAudioCoordination", "1");
  } catch (err) { /* Storage restrictions must not block app startup. */ }
</script>

<script>
    const isNativeCapacitor =
    !!window.Capacitor?.isNativePlatform?.();

  if (
    !isNativeCapacitor &&
    "serviceWorker" in navigator
  ) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js", {
          scope: "./",
          updateViaCache: "none"
        })
        .then((registration) => {
          console.info(
            "BibloZoo service worker registered:",
            registration.scope
          );
        })
        .catch((err) => {
          console.warn(
            "BibloZoo service worker registration failed:",
            err
          );
        });
    });
  }
</script>
