<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#333333">
  <title>Versey Bird</title>

  <style>
    html.vb2-midpoint-black,
    html.vb2-midpoint-black body,
    html.vb2-midpoint-black #app {
      background: #000000 !important;
      background-color: #000000 !important;
    }

    .vb2-reload-first-paint {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: #000000;
    }
  </style>

  <script>
    (function () {
      const key =
        "biblozoo:versey_bird:halfway_nap:v1";

      try {
        const raw =
          sessionStorage.getItem(key);

        if (!raw) return;

        const checkpoint =
          JSON.parse(raw);

        const verseId =
          new URLSearchParams(
            window.location.search
          ).get("verseId") || "";

        const ageMs =
          Date.now() -
          Number(
            checkpoint?.savedAt || 0
          );

        if (
          checkpoint &&
          checkpoint.version === 1 &&
          checkpoint.stage === "nap" &&
          checkpoint.verseId === verseId &&
          ageMs >= 0 &&
          ageMs <= 30 * 60 * 1000
        ) {
          document.documentElement
            .classList.add(
              "vb2-midpoint-black"
            );
        }
      } catch (err) {
        // Normal startup can continue.
      }
    })();
  </script>

  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="./game.css">
</head>
<body>
  <div id="app" class="vm-shell"></div>

  <script>
    (function () {
      if (
        !document.documentElement
          .classList.contains(
            "vb2-midpoint-black"
          )
      ) {
        return;
      }

      const app =
        document.getElementById("app");

      if (!app) return;

      app.innerHTML = `
          <div
            class="vb2-reload-first-paint"
            id="vb2ReloadFirstPaint"
            aria-hidden="true"
          ></div>
        `;
    })();
  </script>

  <script src="../shared/bridge.js"></script>
  <script src="../shared/game-shell.js"></script>
  <script src="./game.js"></script>
</body>
</html>
