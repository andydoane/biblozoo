# Run automated checks for BibloZoo's iOS integration and native-audio experiment branches.
# This checks JavaScript, web assets, and Swift source syntax on Linux for
# the native-audio experiment. It does NOT build/link the iOS Xcode app,
# type-check against iOS SDKs, or replace physical iPhone testing.
name: BibloZoo branch validation

on:
  pull_request:
    branches:
      - ios-prep
      - experiment/native-ios-audio
  push:
    branches:
      - ios-prep
      - experiment/native-ios-audio

permissions:
  contents: read

concurrency:
  group: ios-prep-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Node regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tracked LF line endings
        run: node scripts/validate_tracked_lf_endings.js

      # GitHub's Ubuntu runner has Swift; frontend -parse checks the FULL
      # plugin for grammar errors without needing UIKit/Capacitor modules.
      # Unlike regex assertions, this catches Swift's newline/infix failures
      # from N6q.1. It is NOT an iOS SDK type-check or Xcode build.
      - name: Parse experimental native sound plugin with Swift compiler
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: |
          command -v swiftc
          swiftc -frontend -parse ios/App/App/BibloZooNativeSoundPlugin.swift

      - name: Validate experimental iOS app identity
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_audio_test_identity.js

      - name: Validate native sound smoke test source and bridge
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_sound_smoke_test.js

      - name: Validate opt-in Native Feeding Classic preview (experiment only)
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_feeding_preview_c2.js

      - name: Validate N2.1 native Feeding Resume and async lifecycle
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_feeding_resume_n21.js

      - name: Validate N2.2 audio timing and user-copied diagnostic report
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_audio_timing_n22.js

      - name: Validate N3a predecoded native Feeding effects
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_pcm_effects_n3a.js

      - name: Validate N3b native peg notes, bounded voices and Resume wording
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_peg_voices_n3b.js

      - name: Validate N3c cold native first-launch preflight and explicit retry
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_first_launch_n3c.js

      - name: Validate N3d fixed native Melody note bank and DEV hearing gate
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_melody_bank_n3d.js

      - name: Validate N4a native Melody gameplay, gesture preflight and explicit Resume
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_melody_gameplay_n4a.js

      - name: Validate N4a.1 iOS App Switcher inactive pause and Resume safety
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_app_switcher_pause_n4a1.js

      - name: Validate N4b native Labyrinth landings, catch effects and retry
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_labyrinth_gameplay_n4b.js

      - name: Validate N4c native Bounce impacts, bonuses, catches and retry
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_bounce_gameplay_n4c.js

      - name: Validate N5a native UI taps and quiet Feeding helper UI
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_ui_audio_n5a.js

      - name: Validate N6r Playground Ghost Writer five native spooky clips, timing and PiP
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_playground_ghost_writer_n6r.js

      - name: Validate N6q.5 Great score button, native final stop ACK and source C-major finale
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_jam_score_finale_n6q5.js

      - name: Validate N6q.4 original ios-prep two-layer interstitials and timed scoped native stop
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_jam_original_transition_n6q4.js

      - name: Validate N6q.3 Jam title and speed UI pops, Got It press and transition chords
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_jam_ui_phrases_n6q3.js

      - name: Validate N6q.1 Jam watchdog, early beat cues, fast prewarm and Great finale
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_jam_timing_n6q1.js

      - name: Validate N6q Playground Verse Jam native PCM, groove, and PiP recovery
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_playground_verse_jam_n6q.js

      - name: Validate N6p Playground Wheel 38 native PCM, published speech, spin and PiP
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_playground_wheel_n6p.js

      - name: Validate N6o Playground Scripture Scrub 28 native PCM, 2-percent melody, mower and PiP
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_playground_scripture_scrub_n6o.js

      - name: Validate N6n Playground Verse Typer native PCM, chunk narrator and PiP
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_playground_verse_typer_n6n.js

      - name: Validate N6m Verse Scramble final 18-ID native PCM, original melodies, menu and PiP
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_scramble_n6m.js

      - name: Validate N6l Traffic Tap 1 zoom MP3 + 13 generated native PCM cues and PiP
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_traffic_tap_n6l.js

      - name: Validate N6k Verse Launch 8 MP3 + 4 native generated PCM cues and PiP
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_launch_n6k.js

      - name: Validate N6j Tower of Bible 6 MP3 + 2 native synthesized cues and PiP recovery
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_tower_bible_n6j.js

      - name: Validate N6i Versey Bird native PCM, checkpoint wake and PiP recovery
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_versey_bird_n6i.js

      - name: Validate N6h.2 explicit PiP takeover on Home and seven games, OS-denial retry
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_pip_takeover_n6h2.js

      - name: Validate N6h.1 YouTube PiP interruption, seven native games and Home/Feeding recovery
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_pip_interruption_n6h1.js

      - name: Validate N6h Verse Munch native PCM, actual mobile touchend menus and held App Switcher
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_munch_n6h.js

      - name: Validate N6g Verse Invaders 15 unique PCM IDs, real menu/bonus and held App Switcher
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_invaders_n6g.js

      - name: Validate N6f Dino Dash native PCM, actual jump/menu/halfway sun callbacks and held App Switcher
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_dino_dash_n6f.js

      - name: Validate N6e Verse Splat native PCM, real buttons and held App Switcher
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_splat_n6e.js

      - name: Validate N6d Food Slice native 12-ID PCM, actual buttons and held App Switcher
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_food_slice_n6d.js

      - name: Validate N6c.2 Scripture Snake real title, Back, Help and mode callbacks
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_snake_title_ui_n6c2.js

      - name: Validate N6c.1 native-only Snake and Bible Bugs first UI pops and mode bank lifecycle
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_standalone_ui_pops_n6c1.js

      - name: Validate N6c native Bible Bugs fixed PCM samples, lifecycle and quiet gesture preflight
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_bible_bugs_n6c.js

      - name: Validate N6b.1 quiet Scripture Snake native audio prep and failure-only retry UI
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_snake_quiet_preflight_n6b1.js

      - name: Validate N6b native Scripture Snake fixed sample and orb bank, gesture/Welcome Back recovery
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_snake_effects_n6b.js

      - name: Validate N6a native BibloPet Detail and Flashcards verse previews
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_verse_previews_n6a.js

      - name: Validate N5b.3 native Learn instructions, chunks, Echo and source recovery
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_learn_tracks_n5b3.js

      - name: Validate N5b.2 published native Learn Listen reference and verse
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_learn_listen_n5b2.js

      - name: Validate N5b.1 native Learn narration player DEV proof
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_learn_narration_n5b1.js

      - name: Validate N1 native-only WebKit sound output isolation
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_only_ios_output.js

      - name: Validate daily activity and verse flows
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:daily-question-generators
          npm run validate:daily-question-sessions
          npm run validate:daily-questions
          npm run validate:daily-zoo-todo
          npm run validate:daily-feed-game
          npm run validate:read-my-verse

      - name: Validate Feeding controls, visuals, and audio
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_patch73_feeding_controls.js
          node scripts/validate_patch73_feeding_controls_polish.js
          node scripts/validate_patch73_1_feeding_polish.js
          node scripts/validate_feeding_audio_bounce_patch24.js

      - name: Validate Zoo Escape and cross-app recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_patch72_1a_zoo_escape.js
          node scripts/validate_patch72_1b_feeding_zoo_escape.js
          node scripts/validate_patch72_1c_whole_app_zoo_escape.js
          node scripts/validate_patch72_1c1_whole_app_test_harness.js
          node scripts/validate_patch72_1c2_identity_artwork_exit.js
          node scripts/validate_patch72_1c3_zoo_escape_sounds.js
          node scripts/validate_patch72_1d_zookeeper_stats.js

      - name: Validate Verse Launch menu and bonus pause
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_verse_launch_menu_pause.js

      - name: Validate Flashcards, Read My Verse, and app audio
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_flashcards_patch69.js
          node scripts/validate_read_my_verse_audio_patch70_2.js
          node scripts/validate_read_my_verse_feedback_levels.js
          node scripts/validate_app_audio_patch23b.js
          node scripts/validate_learn_narration_recovery_gate.js

  web-build:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production web bundle for Capacitor
        run: npm run build

      - name: Validate N1 guard placement in every packaged HTML entrypoint
        if: github.base_ref == 'experiment/native-ios-audio' || github.ref == 'refs/heads/experiment/native-ios-audio'
        run: node scripts/validate_native_only_ios_output.js

      - name: Confirm bundled runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/daily_questions_feed_game.js
          test -s dist/verse_games/shared/welcome-back-zoo-escape.js
          test -s dist/profile_pictures/profile_picture_fallback.png
