  web-build:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production web bundle for Capacitor
        run: npm run build

      - name: Audit production dist notices and payload inventory
        run: node scripts/audit_ios_production_packaging.js --dist

      - name: Validate N1 guard placement in every packaged HTML entrypoint
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_only_ios_output.js

      - name: Verify packaged Kids PR1 shared parental-gate assets
        run: node scripts/validate_parental_gate_pr1.js

      - name: Verify packaged Kids PR2 protected share and no test-preview leakage
        run: node scripts/validate_parental_gate_pr2_ghost_share.js

      - name: Verify packaged Kids PR3 Settings parent gate and lock-image assets
        run: node scripts/validate_parental_gate_pr3_settings.js

      - name: Verify packaged Zoo backup v3 helper and family/individual import safety
        run: node scripts/validate_zoo_backup_integrity.js

      - name: Verify packaged Kids PR4 permission state gates and native source
        run: node scripts/validate_parental_gate_pr4_permissions.js

      - name: Verify packaged optional Kids first-launch setup
        run: node scripts/validate_kids_setup_onboarding.js

      - name: Verify packaged Kids setup owner feedback and first-grant recording readiness
        run: node scripts/validate_kids_setup_owner_feedback.js

      - name: Validate packaged production iOS developer controls
        run: node scripts/validate_native_production_dev_hardening.js

      - name: Check packaged native audio resources and SDK version coherence
        run: node scripts/validate_native_ios_resource_packaging.js

      - name: Confirm bundled runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/daily_questions_feed_game.js
          test -s dist/verse_games/shared/welcome-back-zoo-escape.js
          test -s dist/profile_pictures/profile_picture_fallback.png
