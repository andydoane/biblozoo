# Run checks for stable iOS, isolated Audio Test and production integration branches.
# This checks JavaScript, web assets, and Swift source syntax on Linux for
# the native-audio experiment. It does NOT build/link the iOS Xcode app,
# type-check against iOS SDKs, or replace physical iPhone testing.
name: BibloZoo branch validation

on:
  pull_request:
    branches:
      - ios-prep
      - experiment/native-ios-audio
      - integration/native-audio-to-ios-prep
  push:
    branches:
      - ios-prep
      - experiment/native-ios-audio
      - integration/native-audio-to-ios-prep

permissions:
  contents: read

concurrency:
  group: ios-prep-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Node regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tracked LF line endings
        run: node scripts/validate_tracked_lf_endings.js

      - name: Validate child-friendly How to Play and intro splash copy
        run: node scripts/validate_child_friendly_how_to_play.js

      - name: Validate IP01 17-activity How to Play and Game Menu consistency
        run: node scripts/validate_ip01_external_help_menu.js

      - name: Validate IP02 Daily Questions Next and fixed Daily To-Do game mode
        run: node scripts/validate_ip02_daily_next_mode.js

      - name: Validate IP03 onboarding, pet unlock and hub visual contracts
        run: node scripts/validate_ip03_onboarding_pet_hub.js

      - name: Validate IP04 shared Zoo Break popup controls and safe exit
        run: node scripts/validate_ip04_zoo_popup_controls.js

      - name: Validate IP05 result screens and full-board overlays
        run: node scripts/validate_ip05_result_visuals.js

      - name: Validate IP06 Final Test and Feeding return-to-Zoo fades
        run: node scripts/validate_ip06_return_fades.js

      - name: Validate IP07 measured continuous Final Test missing-letter lines
        run: node scripts/validate_ip07_final_test_lines.js

      - name: Validate IP08 Verse Splat and Bible Bugs bonus pace and book-wave fade
        run: node scripts/validate_ip08_practice_bonus_pacing.js

      - name: Validate IP09 Bounce touch callouts and Verse Launch post-cutscene Tilt or Drag
        run: node scripts/validate_ip09_touch_verse_launch.js

      - name: Validate IP10 fifth-round Verse Scramble picture hunt and Verse Launch popup consistency
        run: node scripts/validate_ip10_scramble_picture_hunt.js

      - name: Validate IP11 responsive pet picture hunt, scroll-aware card presses and cutscene copy
        run: node scripts/validate_ip11_picture_density_scroll_cards.js

      - name: Validate Wheel final letter modal and permanent Welcome Back Home
        run: node scripts/validate_welcome_home_wheel_followup.js

      - name: Validate Wheel of Bible native menu mute and resume
        run: node scripts/validate_wheel_menu_mute_resume.js

      - name: Audit all 124 published BSB verses and inactive fallback
        run: node scripts/validate_release_bsb_verse_corpus.js

      - name: Verify production iOS developer controls are hidden
        run: node scripts/validate_native_production_dev_hardening.js

      - name: Verify Release privacy policy screen and standalone page agree
        run: node scripts/validate_release_privacy_policy_alignment.js

      - name: Validate Kids PR1 shared parental gate and one-shot approval
        run: node scripts/validate_parental_gate_pr1.js

      - name: Validate Kids PR2 Ghost Writer native share, cancellation and math bounds
        run: node scripts/validate_parental_gate_pr2_ghost_share.js

      - name: Validate Kids PR3 parent Settings, outgoing links, backup fallback and shared visual design
        run: node scripts/validate_parental_gate_pr3_settings.js

      - name: Validate Kids PR4 first native mic/Photos prompts and bypass audit
        run: node scripts/validate_parental_gate_pr4_permissions.js

      - name: Validate optional native Kids first-launch Grown-up Setup
        run: node scripts/validate_kids_setup_onboarding.js

      - name: Validate Kids setup owner feedback and first-grant recording readiness
        run: node scripts/validate_kids_setup_owner_feedback.js

      - name: Validate iOS first-party privacy manifest and protected-resource purposes
        run: node scripts/validate_native_ios_privacy_manifest.js

      - name: Verify production iOS excludes legacy diagnostics at JS and Swift boundary
        run: node scripts/validate_native_production_diagnostics.js

      - name: Verify native audio resource mappings and Capacitor package pins
        run: node scripts/validate_native_ios_resource_packaging.js

      - name: Test read-only Xcode archive inspector without a Mac or iPhone
        run: node scripts/validate_ios_archive_inspector.js

      - name: Test read-only archived SDK privacy manifest summaries
        run: node scripts/validate_ios_archive_privacy_manifest_summary.js

      - name: Test read-only production packaging inventory and refusal cases
        run: node scripts/validate_ios_production_packaging_audit.js

      - name: Test offline family backup v2/v3 validator without real profiles
        run: node scripts/validate_family_backup_file_test.js

      - name: Validate Zoo backup v3 family/single export, import remapping and rollback
        run: node scripts/validate_zoo_backup_integrity.js

      - name: Validate child Review hub, Listen Activities and Daily reward isolation
        run: node scripts/validate_learn_listen_activities.js

      # GitHub's Ubuntu runner has Swift; frontend -parse checks the FULL
      # plugin for grammar errors without needing UIKit/Capacitor modules.
      # Unlike regex assertions, this catches Swift's newline/infix failures
      # from N6q.1. It is NOT an iOS SDK type-check or Xcode build.
      - name: Parse experimental native sound plugin with Swift compiler
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: |
          command -v swiftc
          swiftc -frontend -parse ios/App/App/BibloZooNativeSoundPlugin.swift
          # N7b adds a DEV-only mic plugin in the existing Xcode SceneDelegate
          # source, so parse the actual modified Swift file too.
          swiftc -frontend -parse ios/App/App/SceneDelegate.swift

      # Portable synthetic logic only; no iOS SDK, UIKit or live Apple calls.
      - name: Validate native age-assurance synthetic policy and compile fences
        if: github.base_ref == 'ios-prep' || github.ref == 'refs/heads/ios-prep'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          source=ios/App/App/BibloZooAgeAssurance.swift
          tests=scripts/validate_ios_age_assurance_foundation.swift
          swiftc "$source" "$tests" -o "$tmpdir/age-ordinary"
          "$tmpdir/age-ordinary"
          swiftc -D DEBUG "$source" "$tests" -o "$tmpdir/age-debug"
          "$tmpdir/age-debug"
          expect_failure() {
            local expected="$1"
            shift
            if swiftc "$@" -typecheck "$source" >"$tmpdir/fence.log" 2>&1; then
              echo "ERROR: forbidden build unexpectedly succeeded"
              return 1
            fi
            cat "$tmpdir/fence.log"
            grep -F -- "$expected" "$tmpdir/fence.log"
          }
          expect_failure 'error: BibloZoo age assurance is not approved for live Release activation.' -D BIBLOZOO_AGE_ASSURANCE_LIVE
          expect_failure 'error: BibloZoo age fixtures are restricted to iOS Debug simulator builds.' -D DEBUG -D BIBLOZOO_AGE_ASSURANCE_FIXTURE
          expect_failure 'error: BibloZoo fixture and live age assurance modes are mutually exclusive.' -D DEBUG -D BIBLOZOO_AGE_ASSURANCE_FIXTURE -D BIBLOZOO_AGE_ASSURANCE_LIVE

      # Welcome Back presentation only: measure full-size name against button
      # width and swap playful busy copy into fixed slot without layout jumps.
      # Recreation only: real Let's go! recovery must run FIRST and succeed,
      # while both Zoo To-Do buttons share the same one-per-day chance.
      - name: Validate random Zoo surprises and preserved audio recovery
        run: node scripts/validate_random_zoo_surprises.js

      - name: Validate shared Welcome Back name sizing and stable recovery progress
        run: node scripts/validate_welcome_back_fit_progress_ui.js

      # Native Audio Test only: no WKWebView Take Photo path, no camera
      # permission, separate PhotosUI/Files pickers and WebKit draw-pad hold.
      - name: Validate Ghost Writer camera-free picker and guide long press
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_ghost_writer_camera_free_picker.js

      # Imported Ghost Writer photos stay in bounded JS RAM, never profile
      # storage. Exercise actual loader, replacement, aspect-cover and cleanup.
      - name: Validate Ghost Writer session photo backgrounds
        run: node scripts/validate_ghost_writer_custom_background.js

      # Native Photos saving uses a purple Welcome Back-style modal.
      # Exercise its real focus lock, progress, cancel, retry, and cleanup.
      - name: Validate Ghost Writer purple export popup and accessibility
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_ghost_writer_export_modal.js

      # Native Audio Test only: Ghost Writer PNG Save Picture share sheet,
      # 1080x1920 30fps H.264 MP4 silent export and cancel/cleanup.
      - name: Validate native Ghost Writer picture share and silent social MP4
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_ghost_writer_export.js

      # Ghost Writer finished-playback Remix button swaps its OS emoji for
      # the existing 1em PNG; verify path, sizing, and click semantics.
      - name: Validate Ghost Writer Remix button PNG and sizing
        run: node scripts/validate_ghost_writer_remix_icon.js

      # Real Daily Zoo To-Do Classic Feeding must use the same native Got It!
      # preparation as its DEV preview and other three native Feeding modes.
      - name: Validate native Classic Feeding from Daily Zoo To-Do
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_classic_zoo_todo_audio.js

      # N7m: external PiP Play/AirPods remote Play can interrupt an ACTIVE
      # Read game while no native clip is owned; it still needs Welcome Back.
      - name: Validate N7m Read native external-audio takeover recovery
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_read_external_audio_n7m.js

      # N7l: original BibloPet box MP3 and four Zoo To-Do onboarding voices
      # must be native-only on Audio Test iOS, with no dead retry button.
      - name: Validate N7l native pet unlock and onboarding narration
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_pet_unlock_onboarding_n7l.js

      # N7k: early iOS lifecycle and quiet interval checkpoints for Chunks
      # and Echo; held App Switcher during yellow speaking must Welcome Back.
      # R06 / PLAY-01: the native clock pauses but Verse Typer CSS
      # caterpillar/tail/blink and in-flight transitions must ALSO freeze in
      # the still-visible held App Switcher thumbnail until real Let's go.
      # R07: Read Balloons/Fish must re-seek their original CSS/WAAPI frames
      # before thaw, and scene timeouts must ignore 10+ seconds of OS inactivity.
      # R08: real Swift Read AVAudioPlayer scheduling helper is compiled
      # against a zeroed post-interruption device clock; never test hearing
      # or Apple SDK linkage from the Linux runner.
      # R09 / FLASH-05: compile production Swift level estimator and
      # real PCM copy against synthetic speech/silence/transients. No voices,
      # output hardware, audio-session activation or Mac SDK in this test.
      # R10 / READ-04: compile and run ACTUAL native Swift WAV synthesis
      # at updated word/finish gains, verify bounded two/four-note mixes.
      # This cannot demonstrate actual speaker/AirPods perceived loudness.
      # R11 / LEARN-01: execute the actual Learn overlay sync function
      # and shared Welcome Back with simulated busy, rotating, retry and
      # fallback states. No new audio activation or pause owner.
      # R12 / READ-01: execute real Typewriter/Keyboard chunk selection
      # against curly/straight opening and closing quote boundaries.
      # This tests exact canonical characters and original narration indices,
      # not actual iPhone typing presentation or audio hardware.
      # R12b: the fixed two-line Typewriter/Keyboard intro must fit its own
      # screen box independently of verse length or the verse font cache.
      # Execute the actual renderer/fitter with synthetic narrow/wide layouts.
      - name: Validate R12b Typewriter Keyboard independent two-line intro
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r12b_read_typing_intro_independent_fit.js

      - name: Validate R12 Read Typewriter and Keyboard quote-boundary ownership
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r12_read_typing_opening_quotes.js

      - name: Validate R11 Learn Welcome Back single busy message and retry
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r11_learn_welcome_back_busy_status.js

      - name: Validate R10 native Read cue relative level and melody peaks
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r10_read_native_cue_loudness.js

      - name: Validate R09 Flashcards measured dry voice replay safety
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r09_flashcards_measured_dry_level.js

      - name: Validate R08 native Read cue first-note and melody spacing
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r08_read_native_cue_timing.js

      - name: Validate R07 Read Balloons and Fish active-time visual resume
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r07_read_balloons_fish_pause_clock.js

      - name: Validate R06 Playground Verse Typer native inactive visual freeze
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r06_playground_verse_typer_visual_freeze.js

      # R05: Native Check the Verse Listen interrupts while UIKit may stay
      # active; reject stale Listening labels and old async completions.
      - name: Validate R05 Daily Check the Verse native Welcome Back and Listen retry
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r05_daily_check_verse_native_recovery.js

      # R04 owner follow-up bundled here: normal in-app Menu must pause
      # the exact Missing Words countdown/animation, not show Welcome Back.
      - name: Validate R04 Missing Words Learn Menu pause follow-up
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r04_learn_menu_pause_followup.js

      # R04: Learn Missing Words must freeze in a held iOS App Switcher
      # even when WebKit stays visible; return only via real Welcome Back.
      - name: Validate R04 Learn Missing Words inactive app-switcher freeze
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_r04_learn_missing_words_inactive_pause.js

      - name: Validate N7k Learn Chunks and Echo silent-phase native interruptions
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_learn_quiet_interruption_n7k.js

      # N7j: a temporary Learn in-app menu should resume native audio on its
      # actual Close tap, without treating it as an OS Welcome Back event.
      - name: Validate N7j Learn menu native Close resume versus real interruption
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_learn_menu_close_n7j.js

      # N7i: actual New Verse picker full-verse speaker uses N5b.2 native
      # AVAudioPlayer; test Stop/switch/Exit/mute and unchanged browser preview.
      - name: Validate N7i New Verse picker native-only verse previews
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_new_verse_picker_n7i.js

      # N7h: Daily Questions answer MP3 and generated Sounds Like prompt must
      # use the native bridge in Audio Test iOS, never HTML/WebAudio fallback.
      - name: Validate N7h Daily Questions native audio and interruption safety
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_daily_questions_audio_n7h.js

      # N7a is a docs/source-contract audit, not native capture. Restrict
      # it to the isolated native-audio experiment and keep current iOS
      # behavior untouched until each sensitive input/DSP PR is approved.
      - name: Validate N7g integrated Read media lifecycle, stale events and RAM-only Flashcards contracts
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_n7g_integrated_audio_lifecycle.js

      - name: Validate N7f.2 immediate Read task-switch freeze and 6-waveform DEV tone auditions
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_n7f2_read_pause_waveform_lab.js

      # Newly uploaded five Flashcards instruction MP3s: native real-ended
      # playback gating, browser mirror, retry and comparison text fitting.
      - name: Validate Flashcards instruction autoplay and comparison text fitting
        run: node scripts/validate_flashcards_instruction_audio.js

      # A retained native Flashcards take restores the original foreground
      # audio session. Narration may start without a second tap, but never
      # after real interruptions or incomplete category restoration.
      - name: Validate post-recording native Flashcards instruction handoff
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_flashcards_native_instruction_handoff.js

      - name: Validate N7f.1 Flashcards coral top toast and stable Next/Continue controls
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_flashcards_top_toast_n7f1.js

      - name: Validate N7f Read My Verse native output and owner-selected Wacky character voices
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_n7f_read_my_verse_output.js

      - name: Validate N7e.1 five Demon and five independent Chorus DEV variants
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_n7e1_demon_chorus_variant_lab.js

      - name: Validate N7e all ten native Wacky Replay presets and compact DEV Lab
        if: github.base_ref == 'experiment/native-ios-audio' || github.base_ref == 'integration/native-audio-to-ios-prep' || github.base_ref == 'ios-prep' || github.ref == 'refs/heads/experiment/native-ios-audio' || github.ref == 'refs/heads/integration/native-audio-to-ios-prep' || github.ref == 'refs/heads/ios-prep'
        run: node scripts/validate_native_n7e_wacky_replay.js

      # R01 regression: a real Flashcards Record barrier drains the Swift
